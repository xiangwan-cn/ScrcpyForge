<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ScrcpyForge 模板获取</title>
<style>
:root{color-scheme:dark;font:15px system-ui,-apple-system,"Segoe UI",sans-serif;background:#090d14;color:#dce5f2}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0,#17213a 0,transparent 32rem)}
header{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;padding:15px 20px;background:#101622ee;border-bottom:1px solid #29344a;backdrop-filter:blur(16px)}
h1{font-size:20px;margin:0 auto 0 0}
button,input{border:1px solid #34415a;border-radius:9px;background:#192336;color:inherit;padding:9px 12px;transition:.15s}
button{cursor:pointer}button:hover{border-color:#6287d7;background:#22314c}button:disabled{opacity:.4;cursor:not-allowed}
main{width:min(980px,100%);margin:0 auto;padding:24px 18px 48px}
.hint{color:#aab7ca;line-height:1.5;margin:0 0 18px}
.status{font-size:13px;color:#9eabc0}.status.ok{color:#5ee89a}.status.error{color:#ff8585}
.device-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.card{display:flex;flex-direction:column;gap:10px;padding:17px;background:linear-gradient(145deg,#151d2b,#101722);border:1px solid #29344a;border-radius:16px;box-shadow:0 12px 35px #0004}
.card h2{font-size:17px;margin:0;overflow-wrap:anywhere}.serial{font-size:13px;color:#aab7ca;overflow-wrap:anywhere}.state{font-size:13px;color:#8e9bb1}
.card .capture{margin-top:auto;width:100%;font-size:16px;padding:11px}.running{color:#5ee89a}.stopped{color:#ffbf69}
.empty{text-align:center;color:#9eabc0;padding:80px 10px;border:1px dashed #34415a;border-radius:16px}
dialog{max-width:96vw;margin:auto;padding:0;background:#141823;color:inherit;border:1px solid #30384a;border-radius:14px;box-shadow:0 24px 70px #000a}
dialog::backdrop{background:#03060bb8;backdrop-filter:blur(3px)}
.dialog-shell{display:grid;gap:12px;padding:18px;max-width:min(1100px,96vw)}
.dialog-shell h2,.dialog-shell p{margin:0}.dialog-title{display:flex;align-items:center;gap:12px}.dialog-title h2{margin-right:auto;font-size:18px}
.canvas-wrap{display:flex;justify-content:center;max-width:calc(96vw - 36px);max-height:76vh;overflow:auto;background:#070a0f;border:1px solid #30384a;border-radius:10px}
#captureCanvas{display:block;max-width:92vw;max-height:74vh;width:auto;height:auto;touch-action:none;cursor:crosshair}
.dialog-actions{display:flex;justify-content:flex-end;gap:9px}.dialog-actions button{min-width:88px}
.save-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,320px);gap:16px;align-items:start}
#templatePreview{display:block;width:100%;max-height:45vh;object-fit:contain;background:#070a0f;border:1px solid #30384a;border-radius:10px}
.save-form{display:grid;gap:8px}.save-form label{display:grid;gap:6px}.save-form input{width:100%}.save-info{font-size:13px;color:#aab7ca;line-height:1.45;overflow-wrap:anywhere}.save-error{color:#ff8585}.save-ok{color:#5ee89a}
@media(max-width:680px){.save-grid{grid-template-columns:1fr}.dialog-shell{padding:13px}}
</style>
</head>
<body>
<header>
  <h1>ScrcpyForge · 模板获取</h1>
  <span id="status" class="status" aria-live="polite">连接中</span>
  <button id="refreshButton" type="button">刷新</button>
</header>
<main>
  <p class="hint">选择已连接的设备，后台会自动启动会话。点击“模板获取”打开当前画面；拖动框选区域后，会先显示模板预览和保存名称确认。</p>
  <section id="devices" class="device-grid" aria-live="polite"></section>
</main>

<dialog id="captureDialog">
  <div class="dialog-shell">
    <div class="dialog-title"><h2 id="captureTitle">模板获取</h2><button id="closeCapture" type="button">关闭</button></div>
    <p id="captureHint" class="hint">在画面上拖动框选模板区域。</p>
    <div class="canvas-wrap"><canvas id="captureCanvas"></canvas></div>
  </div>
</dialog>

<dialog id="saveDialog">
  <div class="dialog-shell">
    <div class="dialog-title"><h2>确认保存模板</h2><button id="cancelSave" type="button">取消</button></div>
    <div class="save-grid">
      <div class="canvas-wrap"><canvas id="templatePreview"></canvas></div>
      <div class="save-form">
        <p id="selectionInfo" class="save-info"></p>
        <label>保存名称（不含目录，自动保存为 PNG）<input id="templateName" maxlength="128" autocomplete="off" spellcheck="false"></label>
        <p id="saveStatus" class="save-info" aria-live="polite"></p>
        <div class="dialog-actions"><button id="confirmSave" type="button">确认保存</button></div>
      </div>
    </div>
  </div>
</dialog>

<script>
const api='/api/v1';
const statusEl=document.getElementById('status');
const devicesEl=document.getElementById('devices');
const captureDialog=document.getElementById('captureDialog');
const captureCanvas=document.getElementById('captureCanvas');
const captureTitle=document.getElementById('captureTitle');
const captureHint=document.getElementById('captureHint');
const saveDialog=document.getElementById('saveDialog');
const templatePreview=document.getElementById('templatePreview');
const templateName=document.getElementById('templateName');
const selectionInfo=document.getElementById('selectionInfo');
const saveStatus=document.getElementById('saveStatus');
const confirmSave=document.getElementById('confirmSave');
let deviceRows=[],activeSessionSerials=new Set(),capture=null,refreshBusy=false;

function escapeHtml(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setStatus(text,kind=''){statusEl.textContent=text;statusEl.className='status '+kind}
async function request(path,options={}){
  const response=await fetch(api+path,{cache:'no-store',...options});
  if(!response.ok)throw Error(await response.text()||('HTTP '+response.status));
  return response.status===204?null:response.json();
}
function defaultName(device){
  return (device.model||device.serial||'template').replace(/[^\p{L}\p{N}_-]+/gu,'-').replace(/^-+|-+$/g,'')||'template';
}
function renderDevices(){
  if(!deviceRows.length){devicesEl.innerHTML='<p class="empty">未发现设备。请先连接 USB 或无线 ADB 设备。</p>';return}
  devicesEl.innerHTML=deviceRows.map(device=>{
    const running=activeSessionSerials.has(device.serial);
    const name=escapeHtml(device.model||device.serial);
    const serial=escapeHtml(device.serial);
    const state=escapeHtml(device.state||'unknown');
    const connected=device.state==='device';
    const label=running?'● 会话运行中':(connected?'○ 会话自动启动中':'○ 设备未就绪');
    return '<article class="card"><h2>'+name+'</h2><div class="serial">'+serial+'</div><div class="state '+(running?'running':'stopped')+'">'+label+' · '+state+'</div><button class="capture" type="button" data-capture="'+serial+'" '+(running?'':'disabled')+'>模板获取</button></article>';
  }).join('');
}
async function refresh(){
  if(refreshBusy)return;
  refreshBusy=true;
  try{
    const snapshot=await request('/state');
    deviceRows=snapshot.devices||[];
    activeSessionSerials=new Set((snapshot.sessions||[]).map(item=>item.serial));
    renderDevices();
    setStatus('后端运行中','ok');
  }catch(error){
    setStatus('后端不可用：'+error.message,'error');
    devicesEl.innerHTML='<p class="empty">无法获取设备列表，请确认 daemon 正在运行。</p>';
  }finally{refreshBusy=false}
}
function canvasPoint(event){
  const rect=captureCanvas.getBoundingClientRect();
  return {
    x:Math.max(0,Math.min(captureCanvas.width,Math.round((event.clientX-rect.left)*captureCanvas.width/rect.width))),
    y:Math.max(0,Math.min(captureCanvas.height,Math.round((event.clientY-rect.top)*captureCanvas.height/rect.height)))
  };
}
function drawCapture(){
  if(!capture)return;
  const ctx=captureCanvas.getContext('2d');
  ctx.clearRect(0,0,captureCanvas.width,captureCanvas.height);
  ctx.drawImage(capture.image,0,0);
  if(!capture.selection)return;
  const {x1,y1,x2,y2}=capture.selection;
  ctx.fillStyle='rgba(44,196,120,.16)';ctx.fillRect(x1,y1,x2-x1,y2-y1);
  ctx.strokeStyle='#65f09d';ctx.lineWidth=Math.max(2,captureCanvas.width/600);ctx.strokeRect(x1+.5,y1+.5,x2-x1-1,y2-y1-1);
}
function showSaveDialog(){
  if(!capture||!capture.selection)return;
  const {x1,y1,x2,y2}=capture.selection,width=x2-x1,height=y2-y1;
  templatePreview.width=width;templatePreview.height=height;
  templatePreview.getContext('2d').drawImage(capture.image,x1,y1,width,height,0,0,width,height);
  selectionInfo.textContent='选区：'+x1+', '+y1+' – '+x2+', '+y2+'（'+width+' × '+height+' px）';
  templateName.value=defaultName(capture.device);
  saveStatus.textContent='';saveStatus.className='save-info';confirmSave.disabled=false;
  saveDialog.showModal();templateName.focus();templateName.select();
}
async function openCapture(serial){
  if(!activeSessionSerials.has(serial)){setStatus('会话正在自动启动，请稍候刷新','error');return}
  const device=deviceRows.find(item=>item.serial===serial)||{serial};
  setStatus('正在获取 '+(device.model||serial)+' 的当前画面…');
  try{
    const response=await fetch(api+'/sessions/'+encodeURIComponent(serial)+'/frame.jpg?capture='+Date.now(),{cache:'no-store'});
    if(!response.ok)throw Error(await response.text()||('HTTP '+response.status));
    const blob=await response.blob(),url=URL.createObjectURL(blob),image=new Image();
    await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=()=>reject(Error('当前画面加载失败'));image.src=url});
    URL.revokeObjectURL(url);
    capture={serial,device,image,start:null,selection:null};
    captureCanvas.width=image.naturalWidth;captureCanvas.height=image.naturalHeight;
    captureTitle.textContent='模板获取 · '+(device.model||serial);captureHint.textContent='在画面上拖动框选模板区域。';drawCapture();captureDialog.showModal();setStatus('后端运行中','ok');
  }catch(error){setStatus('获取画面失败：'+error.message,'error')}
}
function validName(value){return value&&value!=='.'&&value!=='..'&&value.length<=128&&!/[\\/\0-\x1f\x7f]/.test(value)}
async function saveTemplate(){
  if(!capture||!capture.selection)return;
  const name=templateName.value.trim().replace(/\.png$/i,'');
  if(!validName(name)){saveStatus.textContent='请输入有效的模板名称，不要包含目录分隔符。';saveStatus.className='save-info save-error';return}
  confirmSave.disabled=true;saveStatus.textContent='正在保存…';saveStatus.className='save-info';
  try{
    const {x1,y1,x2,y2}=capture.selection;
    const result=await request('/sessions/'+encodeURIComponent(capture.serial)+'/regions',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({path:name+'.png',x1,y1,x2,y2})});
    saveStatus.textContent='已保存：'+(result.path||name+'.png');saveStatus.className='save-info save-ok';captureHint.textContent='模板已保存，可关闭窗口后继续获取。';
  }catch(error){saveStatus.textContent='保存失败：'+error.message;saveStatus.className='save-info save-error';confirmSave.disabled=false}
}
devicesEl.addEventListener('click',event=>{const button=event.target.closest('[data-capture]');if(button)openCapture(button.dataset.capture)});
captureCanvas.addEventListener('pointerdown',event=>{if(!capture)return;event.preventDefault();captureCanvas.setPointerCapture(event.pointerId);capture.start=canvasPoint(event);capture.selection=null;drawCapture()});
captureCanvas.addEventListener('pointermove',event=>{if(!capture||!capture.start)return;event.preventDefault();const point=canvasPoint(event),start=capture.start;capture.selection={x1:Math.min(start.x,point.x),y1:Math.min(start.y,point.y),x2:Math.max(start.x,point.x),y2:Math.max(start.y,point.y)};drawCapture()});
captureCanvas.addEventListener('pointerup',event=>{if(!capture||!capture.start)return;event.preventDefault();const point=canvasPoint(event),start=capture.start;capture.start=null;capture.selection={x1:Math.min(start.x,point.x),y1:Math.min(start.y,point.y),x2:Math.max(start.x,point.x),y2:Math.max(start.y,point.y)};drawCapture();if(capture.selection.x2>capture.selection.x1&&capture.selection.y2>capture.selection.y1)showSaveDialog()});
captureCanvas.addEventListener('pointercancel',()=>{if(capture)capture.start=null});
document.getElementById('refreshButton').addEventListener('click',refresh);
document.getElementById('closeCapture').addEventListener('click',()=>captureDialog.close());
document.getElementById('cancelSave').addEventListener('click',()=>saveDialog.close());
confirmSave.addEventListener('click',saveTemplate);
templateName.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();saveTemplate()}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
refresh();setInterval(()=>{if(!document.hidden)refresh()},5000);
</script>
</body>
</html>
