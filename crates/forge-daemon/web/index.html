<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ScrcpyForge</title><style>
:root{color-scheme:dark;font:15px system-ui;background:#090d14;color:#dce5f2}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#17213a 0,transparent 32rem)}
header{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 18px;background:#101622ef;border-bottom:1px solid #29344a;backdrop-filter:blur(16px)}h1{font-size:20px;margin:0;margin-right:auto}.ok,.running{color:#5ee89a}.stalled{color:#ffbf69}.stopped{color:#94a3b8}
button,input,select{border:1px solid #34415a;border-radius:9px;background:#192336;color:inherit;padding:9px 11px;transition:.15s}button:hover{border-color:#6287d7;background:#22314c}button:disabled{opacity:.4}main{padding:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:16px}
.card{background:linear-gradient(145deg,#151d2b,#101722);border:1px solid #29344a;border-radius:16px;padding:13px;box-shadow:0 12px 35px #0004}.card img{display:block;width:100%;aspect-ratio:9/16;max-height:520px;object-fit:contain;background:#070a0f;border-radius:11px}.row{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:10px}.row b{margin-right:auto}.serial,.metrics{opacity:.72;font-size:13px;margin-top:6px}.pill{border:1px solid #35435d;border-radius:999px;padding:3px 8px;font-size:12px}.empty{text-align:center;opacity:.6;padding:80px 10px}dialog{max-width:92vw;background:#141823;color:inherit;border:1px solid #30384a;border-radius:12px}canvas{max-width:85vw;max-height:75vh}
</style></head><body>
<header><h1>ScrcpyForge</h1><span id="status">连接中</span><button onclick="startSessions()">启动全部会话</button><button onclick="stopSessions()">停止全部会话</button><button onclick="stopAllScripts()">停止全部脚本</button><input id="endpoint" placeholder="192.168.1.10:5555"><button onclick="connectDevice()">连接</button><button onclick="scan()">扫描</button></header>
<main><div id="devices" class="grid"></div></main><dialog id="picker"><canvas id="pickerCanvas"></canvas><p id="pickerInfo">点击取坐标或拖动框选模板</p><button onclick="picker.close()">关闭</button></dialog>
<script>
const api='/api/v1',streams=new Map(),modes=new Map(),choices=new Map(),frameUrls=new Map(),blank='data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg"/%3E';let scriptNames=[];
async function json(path,opts){const r=await fetch(api+path,opts);if(!r.ok)throw Error(await r.text());return r.status===204?null:r.json()}
const post=(path,body={})=>json(path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const profileOptions=(active,prefix)=>[['auto','自动'],['eco','节能'],['balanced','均衡'],['realtime','实时']].map(([id,label])=>`<option value="${id}" ${active===id?'selected':''}>${prefix}·${label}</option>`).join('');
async function start(serial){await post(`/sessions/${encodeURIComponent(serial)}/start`);await setMode(serial,modes.get(serial)||'realtime');refresh()}
async function stopSession(serial){await post(`/sessions/${encodeURIComponent(serial)}/stop`);closeStream(serial);refresh()}
function closeStream(serial){const ws=streams.get(serial);if(ws)ws.close();streams.delete(serial)}
async function setMode(serial,mode){modes.set(serial,mode);await post(`/sessions/${encodeURIComponent(serial)}/preview-mode`,{mode});closeStream(serial);if(mode==='realtime')openStream(serial)}
function openStream(serial){if(streams.has(serial))return;const scheme=location.protocol==='https:'?'wss':'ws',ws=new WebSocket(`${scheme}://${location.host}${api}/sessions/${encodeURIComponent(serial)}/preview`);ws.binaryType='blob';ws.onmessage=e=>{const previous=frameUrls.get(serial),url=URL.createObjectURL(e.data);frameUrls.set(serial,url);const img=document.querySelector(`[data-frame="${CSS.escape(serial)}"]`);if(img)img.src=url;if(previous)URL.revokeObjectURL(previous)};ws.onclose=()=>streams.delete(serial);streams.set(serial,ws)}
async function refresh(){try{
 const [ds,sessions,runs]=await Promise.all([json('/devices'),json('/sessions'),json('/scripts/runs')]),activeSessions=new Set(sessions),activeRuns=new Map(runs.map(r=>[r.serial,r]));
 const metrics=new Map(await Promise.all(sessions.map(async s=>[s,await json(`/sessions/${encodeURIComponent(s)}/metrics`).catch(()=>null)])));
 status.textContent='后端运行中';status.className='ok';devices.innerHTML=ds.length?ds.map((d,i)=>card(d,i,activeSessions,activeRuns,metrics)).join(''):'<p class="empty">未发现设备</p>';
 for(const serial of sessions)if((modes.get(serial)||'realtime')==='realtime')openStream(serial);
}catch(e){status.textContent='后端不可用：'+e.message;status.className=''}}
function card(d,i,sessions,runs,metrics){const sr=sessions.has(d.serial),run=runs.get(d.serial),selected=choices.get(d.serial)||scriptNames[0]||'',mode=modes.get(d.serial)||'realtime',m=metrics.get(d.serial);choices.set(d.serial,selected);const q=JSON.stringify(d.serial),url=sr?(mode==='realtime'?(frameUrls.get(d.serial)||blank):mode==='five_seconds'?`${api}/sessions/${encodeURIComponent(d.serial)}/frame.jpg?t=${Date.now()}`:blank):`${api}/devices/${encodeURIComponent(d.serial)}/screenshot?t=${Date.now()}`;return `<article class="card">
 <img data-frame="${esc(d.serial)}" src="${url}" loading="lazy"><div class="row"><b>${esc(d.model||d.serial)}</b><span class="pill">${d.wireless?'无线':'USB'}</span><span class="pill ${sr?'running':'stopped'}">${sr?'● 会话运行':'○ 会话停止'}</span></div><div class="serial" title="${esc(d.serial)}">${esc(d.serial)} · ${esc(d.state)}</div>
 ${m?`<div class="metrics">近 5 秒：解码 ${m.decoded_fps.toFixed(1)} · 预览 ${m.preview_fps.toFixed(1)} · 脚本 ${m.script_fps.toFixed(1)} FPS · 帧龄 ${m.latest_frame_age_ms.toFixed(0)} ms<br>脚本 P50 ${m.script_p50_ms.toFixed(1)} / P95 ${m.script_p95_ms.toFixed(1)} ms · 丢帧 ${m.dropped_script_frames}</div>`:''}
 <div class="row">${sr?`<button onclick='stopSession(${q})'>停止会话</button>`:`<button onclick='start(${q})'>启动会话</button>`}<select onchange='setMode(${q},this.value)'>${[['realtime','实时预览'],['five_seconds','五秒一图'],['off','关闭预览']].map(([id,label])=>`<option value="${id}" ${mode===id?'selected':''}>${label}</option>`).join('')}</select>${sr?`<select title="脚本性能" onchange='setScriptProfile(${q},this.value)'>${profileOptions(m?.profile||'auto','脚本')}</select><select title="预览性能" onchange='setPreviewProfile(${q},this.value)'>${profileOptions(m?.preview_profile||'eco','预览')}</select>`:''}<button ${sr?'':'disabled'} onclick='inspectFrame(${q},"point")'>点选坐标</button><button ${sr?'':'disabled'} onclick='inspectFrame(${q},"region")'>框选模板</button></div>
 <div class="row"><select id="script-${i}" onchange='choices.set(${q},this.value)'>${scriptNames.map(n=>`<option ${n===selected?'selected':''}>${esc(n)}</option>`).join('')}</select>${run?`<span class="pill ${run.stalled?'stalled':'running'}">${run.stalled?'⚠ 疑似卡顿':'●'} ${esc(run.name||'脚本')}</span><button onclick='stopScript(${q})'>停止脚本</button>`:`<button ${sr&&selected?'':'disabled'} onclick='runOne(${q},${i})'>运行脚本</button>`}</div></article>`}
async function scan(){await post('/devices/scan');refresh()}async function connectDevice(){const value=endpoint.value.trim();if(!/^\[?[0-9a-fA-F:.]+\]?:\d+$/.test(value)){status.textContent='请输入 IP:端口';return}try{status.textContent='正在连接 '+value;await post('/devices/connect',{endpoint:value});await refresh()}catch(e){status.textContent='连接失败：'+e.message}}
async function setScriptProfile(serial,profile){await post(`/sessions/${encodeURIComponent(serial)}/script-profile`,{profile})}async function setPreviewProfile(serial,profile){await post(`/sessions/${encodeURIComponent(serial)}/preview-profile`,{profile})}
async function loadScripts(){scriptNames=await json('/scripts');refresh()}async function runOne(serial,i){const name=document.getElementById(`script-${i}`).value;choices.set(serial,name);await post('/scripts/run-named',{serial,name});refresh()}async function stopScript(serial){await post(`/scripts/devices/${encodeURIComponent(serial)}/stop`);refresh()}async function stopAllScripts(){await post('/scripts/stop-all');refresh()}
async function startSessions(){await post('/sessions/start-all');refresh()}async function stopSessions(){await post('/sessions/stop-all');for(const key of [...streams.keys()])closeStream(key);refresh()}
async function inspectFrame(serial,mode){const img=new Image();img.src=`${api}/sessions/${encodeURIComponent(serial)}/frame.jpg?t=${Date.now()}`;await img.decode();const c=pickerCanvas;c.width=img.naturalWidth;c.height=img.naturalHeight;c.getContext('2d').drawImage(img,0,0);let start=null;const point=e=>{const r=c.getBoundingClientRect();return[Math.round((e.clientX-r.left)*c.width/r.width),Math.round((e.clientY-r.top)*c.height/r.height)]};c.onpointerdown=e=>start=point(e);c.onpointerup=async e=>{const end=point(e);if(mode==='point'){pickerInfo.textContent=`设备 ${serial} · 坐标 (${end[0]}, ${end[1]})`;return}if(!start)return;const[x1,x2]=[start[0],end[0]].sort((a,b)=>a-b),[y1,y2]=[start[1],end[1]].sort((a,b)=>a-b);if(x2<=x1||y2<=y1)return;const safe=serial.replace(/[^A-Za-z0-9_-]/g,'_'),path=prompt('保存位置（相对模板目录或绝对路径）',`${safe}-template.png`);if(path){const result=await post(`/sessions/${encodeURIComponent(serial)}/regions`,{path,x1,y1,x2,y2});pickerInfo.textContent=`设备 ${serial} · 区域 (${x1},${y1})-(${x2},${y2}) · 已保存 ${result.path}`}};pickerInfo.textContent=mode==='point'?`设备 ${serial}：点击画面获取坐标`:`设备 ${serial}：拖动框选模板区域`;picker.showModal()}
document.addEventListener('visibilitychange',()=>{if(document.hidden){for(const serial of [...streams.keys()])closeStream(serial)}else{refresh()}});
loadScripts();setInterval(()=>{if(!document.hidden)refresh()},5000);
</script></body></html>
