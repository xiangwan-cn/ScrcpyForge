[package]
name = "forge-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "1"
async-trait = "0.1"
ffmpeg-next = "8"
mlua = { version = "0.10", features = ["lua54", "vendored", "send"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "rt-multi-thread", "sync", "time", "io-util", "fs", "net", "macros"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.9"
mdns-sd = "0.13"
bytes = "1"

[build-dependencies]
cc = "1"
